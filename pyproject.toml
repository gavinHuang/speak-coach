[project]
name = "speak-coach"
version = "0.1.0"
description = "Local spoken-English evaluator: pronunciation, prosody, fluency, coherence, register"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "numpy",
  "scipy",
  "soundfile",
  "praat-parselmouth>=0.4.4",
  "phonemizer>=3.3",
  "torch>=2.4",
  "transformers>=4.45",
  "mlx-whisper>=0.4.2",
  "mlx-lm>=0.24",
  "kokoro>=0.9.4",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "pyarrow>=26.0.0",
  "yt-dlp>=2026.10.21",
]
